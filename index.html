<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牠們在看｜限量周邊一番賞抽獎</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#2c3748;
  color:white;
  font-family:Arial, "Noto Sans TC", sans-serif;
  min-height:100vh;
  overflow:hidden;
}

.page{
  position:relative;
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.logo{
  position:absolute;
  top:18px;
  left:18px;

  width:120px;

  z-index:10;

  user-select:none;
  pointer-events:none;
}

.top-light{
  position:absolute;
  top:35px;
  left:50%;
  transform:translateX(-50%);
  width:46px;
  height:14px;
  border-radius:5px;
  background:#985a99;
}

.spotlight{
  position:absolute;
  top:86px;
  left:50%;
  transform:translateX(-50%);
  width:105vw;
  height:78vh;
  background:#d48b79;
  clip-path:polygon(42% 0, 58% 0, 100% 68%, 100% 100%, 0 100%, 0 68%);
  border-radius:0 0 50% 50% / 0 0 14% 14%;
  z-index:0;
}

.light-dot{
  position:absolute;
  top:84px;
  left:50%;
  transform:translateX(-50%);
  width:28px;
  height:28px;
  background:#ffe89d;
  border-radius:50%;
  z-index:2;
}

.container{
  position:relative;
  z-index:3;
  width:100%;
  max-width:430px;
  min-height:100vh;
  padding:210px 22px 40px;
}

h1{
  font-size:25px;
  margin:0 auto 12px;
  font-weight:900;
  letter-spacing:1px;
}

.title-line{
  width:72%;
  height:2px;
  background:white;
  margin:0 auto 16px;
  opacity:.9;
}

p{
  margin:0;
  font-size:16px;
  line-height:1.6;
  font-weight:700;
}

button{
  margin-top:22px;
  padding:12px 34px;
  border:none;
  border-radius:999px;
  background:#985a99;
  color:white;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 0 rgba(64,55,110,.45);
}

button:active{
  transform:translateY(4px);
  box-shadow:0 4px 0 rgba(64,55,110,.45);
}

.egg-area{
  display:none;
  justify-content:center;
  align-items:flex-end;
  gap:24px;
  margin-top:82px;
}

.egg-wrap{
  position:relative;
}

.egg-wrap.middle{
  transform:translateY(60px);
}

.shadow{
  position:absolute;
  left:50%;
  bottom:-10px;
  transform:translateX(-50%);
  width:84px;
  height:15px;
  background:#6f5a9c;
  border-radius:50%;
  z-index:0;
}

.egg{
  position:relative;
  width:94px;
  height:128px;
  background:#f7f2e8;
  border-radius:52% 52% 45% 45%;
  cursor:pointer;
  z-index:1;
  box-shadow:18px 0 0 #f4df9e;
  transition:.25s;
  user-select:none;
  font-size:0;
}

.egg::before{
  content:"";
  position:absolute;
  top:0;
  left:10px;
  width:52px;
  height:92px;
  background:rgba(255,255,255,.7);
  border-radius:50%;
}

.egg:hover{
  transform:translateY(-6px);
}

.egg.shake{
  animation:shake .08s infinite;
}

@keyframes shake{
  0%{ transform:rotate(0deg); }
  25%{ transform:rotate(9deg); }
  50%{ transform:rotate(-9deg); }
  75%{ transform:rotate(7deg); }
  100%{ transform:rotate(0deg); }
}

.hidden{
  display:none;
}

.result-card{
  display:none;
  margin:72px auto 0;
  width:88%;
  max-width:330px;
  background:rgba(44,55,72,.94);
  border:2px solid white;
  border-radius:24px;
  padding:24px 20px;
  box-shadow:0 0 28px rgba(255,255,255,.18);
  line-height:1.7;
}

.result-card.show{
  display:block;
  animation:pop .35s ease forwards;
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.85);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.result-small{
  font-size:15px;
  opacity:.8;
  margin-bottom:10px;
}

.result-prize{
  font-size:20px;
  font-weight:900;
}

.status{
  margin-top:105px;
  font-size:13px;
  opacity:.75;
}

@media(max-width:430px){
  .container{
    padding-top:210px;
  }

  h1{
    font-size:24px;
  }

  p{
    font-size:15px;
  }

  .egg-area{
    gap:16px;
  }

  .egg{
    width:78px;
    height:108px;
    box-shadow:15px 0 0 #f4df9e;
  }

  .egg::before{
    width:44px;
    height:78px;
  }

  .shadow{
    width:72px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="logo">
  <img src="images/logo.png" class="logo">
  </div>

  <div class="top-light"></div>
  <div class="spotlight"></div>
  <div class="light-dot"></div>

  <div class="container">

    <h1>限量周邊一番賞抽獎</h1>
    <div class="title-line"></div>

    <p id="introText">
      請先完成現場付款 NT$280。<br>
      付款完成後，點擊下方按鈕開始抽選。
    </p>

    <button id="startBtn" onclick="showEggs()">開始抽獎</button>

    <div class="egg-area" id="eggArea">
      <div class="egg-wrap">
        <div class="egg" onclick="chooseEgg(this)"></div>
        <div class="shadow"></div>
      </div>

      <div class="egg-wrap middle">
        <div class="egg" onclick="chooseEgg(this)"></div>
        <div class="shadow"></div>
      </div>

      <div class="egg-wrap">
        <div class="egg" onclick="chooseEgg(this)"></div>
        <div class="shadow"></div>
      </div>
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-small">蛋已開啟，你獲得了</div>
      <div class="result-prize" id="resultPrize"></div>
    </div>

    <div class="status" id="status">觀察系統待命中...</div>

  </div>
</div>

<script>
const prizes = [
  "遊戲場景造型立牌｜光之室",
  "遊戲場景造型立牌｜破殼夢",
  "遊戲場景造型立牌｜格子籠",
  "遊戲場景造型立牌｜食槽前的抉擇",
  "遊戲場景造型立牌｜全員淘汰",

  "卡牌流沙吊飾｜行動卡牌",
  "卡牌流沙吊飾｜真相卡牌",
  "卡牌流沙吊飾｜幻覺卡牌",

  "角色插圖磁吸燈箱｜斷喙者・喀喀",
  "角色插圖磁吸燈箱｜編碼觀測者・C-98",
  "角色插圖磁吸燈箱｜失焦者・No.13",
  "角色插圖磁吸燈箱｜羽封者・小白",
  "角色插圖磁吸燈箱｜孵夢者・殼裡裡",
  "角色插圖磁吸燈箱｜語者・啼鳴零號"
];

let alreadyChosen = false;

function showEggs(){
  document.getElementById("startBtn").style.display = "none";
  document.getElementById("introText").innerHTML =
    "請選擇一顆蛋<br>牠會替你開啟本次配給結果";

  document.getElementById("eggArea").style.display = "flex";
  document.getElementById("status").innerText = "真相碎片同步中...";
}

function chooseEgg(egg){
  if(alreadyChosen) return;
  alreadyChosen = true;

  const allWraps = document.querySelectorAll(".egg-wrap");

  allWraps.forEach(wrap => {
    if(!wrap.contains(egg)){
      wrap.classList.add("hidden");
    }
  });

  egg.classList.add("shake");
  document.getElementById("status").innerText =
    "蛋殼反應劇烈，配給結果生成中...";

  setTimeout(() => {
    const prize = prizes[Math.floor(Math.random() * prizes.length)];

    egg.classList.remove("shake");
    egg.parentElement.classList.add("hidden");

    document.getElementById("resultPrize").innerText = prize;
    document.getElementById("resultCard").classList.add("show");

    document.getElementById("status").innerText =
      "抽選完成，請向工作人員出示此畫面領取。";
  }, 1800);
}
</script>

</body>
</html>
