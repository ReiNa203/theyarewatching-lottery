<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牠們在看｜限量周邊一番賞抽獎</title>

<style>

@font-face{
  font-family:"Cubic11";
  src:url("fonts/Cubic_11.ttf") format("truetype");
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#2c3748;
  color:white;
  font-family:Arial, "Noto Sans TC", sans-serif;
  min-height:100vh;
  overflow:hidden;
}

.page{
  position:relative;
  width:100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* LOGO */

.logo{
  position:absolute;
  top:18px;
  left:18px;
  width:76px;
  z-index:10;
  user-select:none;
  pointer-events:none;
}

/* 燈 */

.lamp{
  position:absolute;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  width:110px;
  z-index:5;
  user-select:none;
  pointer-events:none;
}

/* 聚光燈 */

.spotlight{
  position:absolute;
  top:92px;
  left:50%;
  transform:translateX(-50%);
  width:110vw;
  height:78vh;
  background:#d48d7d;

  clip-path:polygon(
    42% 0,
    58% 0,
    100% 66%,
    100% 100%,
    0 100%,
    0 66%
  );

  border-radius:0 0 50% 50% / 0 0 16% 16%;

  z-index:0;
}

/* 內容 */

.container{
  position:relative;
  z-index:3;
  width:100%;
  max-width:430px;
  min-height:100vh;
  padding-top:245px;
  padding-left:22px;
  padding-right:22px;
}

/* 標題 */

h1{
  font-size:28px;
  margin:0 auto 10px;
  font-weight:900;
  letter-spacing:1px;
  transform:translateY(-10px);

  font-family:"Cubic11", sans-serif;
}

.title-line{
  width:72%;
  height:2px;
  background:white;
  margin:0 auto 18px;
  opacity:.9;
}

p{
  margin:0;
  font-size:15px;
  line-height:1.45;
  font-weight:700;
  transform:translateY(-2px);
}

/* 按鈕 */

button{
  margin-top:22px;
  padding:12px 34px;
  border:none;
  border-radius:999px;
  background:#985a99;
  color:white;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 0 rgba(64,55,110,.45);

  font-family:"Cubic11", sans-serif;

  letter-spacing:1px;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 4px 0 rgba(64,55,110,.45);
}

/* 蛋 */

.egg-area{
  display:none;
  justify-content:center;
  align-items:flex-end;
  gap:6px;
  margin-top:70px;
}

.egg-wrap{
  position:relative;
}

.egg-wrap.middle{
  transform:translateY(58px);
}

.shadow{
  position:absolute;
  left:50%;
  bottom:4px;
  transform:translateX(-50%);
  width:92px;
  height:16px;
  background:#6f5a9c;
  border-radius:50%;
  z-index:0;
  opacity:.95;
}

.egg{
  position:relative;

  width:138px;
  height:178px;

  background-image:url("images/egg.png");
  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;

  cursor:pointer;

  z-index:1;

  transition:.25s;

  user-select:none;
}

.egg:hover{
  transform:translateY(-6px);
}

/* 搖晃 */

.egg.shake{
  animation:shake .08s infinite;
}

@keyframes shake{
  0%{ transform:rotate(0deg); }
  25%{ transform:rotate(9deg); }
  50%{ transform:rotate(-9deg); }
  75%{ transform:rotate(7deg); }
  100%{ transform:rotate(0deg); }
}

.hidden{
  display:none;
}

/* 結果蛋 */

.result-card{
  display:none;

  margin:52px auto 0;

  width:260px;
  height:340px;

  background-image:url("images/bigegg.png");
  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;

  padding:88px 34px 40px;

  color:#2d3142;

  line-height:1.6;

  box-shadow:none;
}

.result-card.show{
  display:block;
  animation:pop .35s ease forwards;
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.85);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.result-small{
  font-size:16px;
  opacity:1;
  margin-bottom:34px;
  font-weight:700;
}

.result-prize{
  font-size:24px;
  font-weight:900;
  line-height:1.5;

  font-family:"Cubic11", sans-serif;
}

/* 底部文字 */

.status{
  position:absolute;
  bottom:72px;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  font-size:13px;
  line-height:1.7;
  opacity:.9;
  color:#2d3142;
  font-weight:700;
}

/* 手機 */

@media(max-width:430px){

  .logo{
    width:76px;
  }

  .container{
    padding-top:245px;
  }

  h1{
    font-size:28px;
  }

  p{
    font-size:15px;
  }

  .egg{
    width:118px;
    height:152px;
  }

  .shadow{
    width:82px;
    height:14px;
  }

  .egg-area{
    gap:8px;
    margin-top:88px;
  }

  .result-card{
    width:230px;
    height:300px;

    padding:82px 28px 34px;
  }
}

</style>
</head>

<body>

<div class="page">

  <!-- LOGO -->
  <img src="images/logo.png" class="logo">

  <!-- 燈 -->
  <img src="images/light.png" class="lamp">

  <!-- 聚光燈 -->
  <div class="spotlight"></div>

  <!-- 內容 -->
  <div class="container">

    <h1>限量周邊一番賞抽獎</h1>

    <div class="title-line"></div>

    <p id="introText">
      請選擇一顆蛋<br>
      牠會替你開啟本次配給結果
    </p>

    <button id="startBtn" onclick="showEggs()">
      開始抽獎
    </button>

    <!-- 蛋 -->
    <div class="egg-area" id="eggArea">

      <div class="egg-wrap">
        <div class="egg" onclick="chooseEgg(this)"></div>
        <div class="shadow"></div>
      </div>

      <div class="egg-wrap middle">
        <div class="egg" onclick="chooseEgg(this)"></div>
        <div class="shadow"></div>
      </div>

      <div class="egg-wrap">
        <div class="egg" onclick="chooseEgg(this)"></div>
        <div class="shadow"></div>
      </div>

    </div>

    <!-- 結果 -->
    <div class="result-card" id="resultCard">

      <div class="result-small">
        蛋已開啟<br>
        恭喜你獲得:
      </div>

      <div class="result-prize" id="resultPrize"></div>

    </div>

    <!-- 底部 -->
    <div class="status" id="status">
      請先完成現場付款 NT$280<br>
      付款完成後即可開始抽選
    </div>

  </div>
</div>

<script>

const prizes = [

  "遊戲場景造型立牌<br>光之室",
  "遊戲場景造型立牌<br>破殼夢",
  "遊戲場景造型立牌<br>格子籠",
  "遊戲場景造型立牌<br>食槽前的抉擇",
  "遊戲場景造型立牌<br>全員淘汰",

  "卡牌流沙吊飾<br>行動卡牌",
  "卡牌流沙吊飾<br>真相卡牌",
  "卡牌流沙吊飾<br>幻覺卡牌",

  "角色插圖磁吸燈箱<br>斷喙者・喀喀",
  "角色插圖磁吸燈箱<br>編碼觀測者・C-98",
  "角色插圖磁吸燈箱<br>失焦者・No.13",
  "角色插圖磁吸燈箱<br>羽封者・小白",
  "角色插圖磁吸燈箱<br>孵夢者・殼裡裡",
  "角色插圖磁吸燈箱<br>語者・啼鳴零號"

];

let alreadyChosen = false;

/* 開始 */

function showEggs(){

  document.getElementById("startBtn").style.display = "none";

  document.getElementById("introText").innerHTML =
  "請選擇一顆蛋<br>牠會替你開啟本次配給結果";

  document.getElementById("eggArea").style.display = "flex";

  document.getElementById("status").innerHTML = "";
}

/* 選蛋 */

function chooseEgg(egg){

  if(alreadyChosen) return;

  alreadyChosen = true;

  const allWraps = document.querySelectorAll(".egg-wrap");

  allWraps.forEach(wrap => {

    if(!wrap.contains(egg)){
      wrap.classList.add("hidden");
    }

  });

  egg.classList.add("shake");

  setTimeout(() => {

    const prize =
    prizes[Math.floor(Math.random() * prizes.length)];

    egg.classList.remove("shake");

    egg.parentElement.classList.add("hidden");

    document.getElementById("resultPrize").innerHTML =
    prize;

    document.getElementById("resultCard").classList.add("show");

    document.getElementById("status").innerHTML =
    "抽選完成，請向工作人員出示此畫面領取";

  }, 1800);
}

</script>

</body>
</html>
