<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牠們在看｜周邊抽選</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial, "Noto Sans TC", sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.box{
  width:90%;
  max-width:480px;
  padding:30px;
}

h1{
  font-size:30px;
}

p{
  line-height:1.8;
  opacity:.8;
}

button{
  margin-top:25px;
  padding:15px 36px;
  font-size:20px;
  border:none;
  border-radius:999px;
  background:#fff;
  color:#000;
}

#result{
  margin-top:35px;
  font-size:26px;
  font-weight:bold;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="box">
  <h1>真相周邊抽選</h1>

  <p>
    請先完成現場付款 NT$280。<br>
    付款完成後，點擊下方按鈕開始抽選。
  </p>

  <button id="drawBtn">開始抽選</button>

  <div id="result"></div>
</div>

<script>
document.getElementById("drawBtn").addEventListener("click", function(){

  var prizes = [
    "No.13 壓克力吊飾",
    "真相碎片貼紙組",
    "C-98 徽章",
    "展場限定明信片",
    "觀察者小卡"
  ];

  var index = Math.floor(Math.random() * prizes.length);
  var prize = prizes[index];

  document.getElementById("result").innerHTML =
    "你獲得了：<br>" + prize;
});
</script>

</body>
</html>
